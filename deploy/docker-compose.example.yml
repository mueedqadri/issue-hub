# Copy next to your checkout of this repo, set HUBS, then: docker compose up -d --build
# Create ./data first (mkdir data) so Docker does not create it as root.
services:
  issue-board:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: issue-board
    environment:
      # One git source per hub, separated by spaces.
      HUBS: "https://github.com/you/your-app-hub.git"
      SYNC_INTERVAL: "120"
    # The viewer has no login: keep it on localhost, a VPN or a tailnet.
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data:/data
    user: "1000:1000"
    init: true
    read_only: true
    restart: unless-stopped
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8788/hubs.json"]
      interval: 60s
      timeout: 5s
      retries: 3
